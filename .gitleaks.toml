# gitleaks configuration (issue #72). Extends the upstream default ruleset — which already covers
# the provider keys this project uses (Anthropic, OpenAI, Azure) — and narrows the false positives
# that come from a repo whose whole subject matter is API keys and PII.

[extend]
useDefault = true

[allowlist]
description = "Placeholders, fixtures and documentation — never real credentials"

paths = [
  # Templates and docs deliberately show what a key LOOKS like.
  '''\.env\.example''',
  '''docs/security\.md''',
  '''AGENTS\.md''',
  # Test fixtures use obviously fake keys ("sk-test-fake-key") so the suite can build clients.
  '''tests/conftest\.py''',
  '''tests/.*/conftest\.py''',
]

regexes = [
  # Fake keys used by the test suite and the mock LLM harness.
  '''sk-test-fake-key''',
  '''sk-ant-test-fake-key''',
  '''your-.*-api-key''',
  '''not-needed''',
  # The E2E/eval stack uses fixed throwaway credentials against an ephemeral local Postgres.
  '''e2e-secret''',
  '''mypassword''',
  # Guardrail test vectors: a syntactically valid but fake key, and the sample CPF/CNPJ used to
  # test check-digit validation (public, well-known test documents).
  '''sk-abcdefghijklmnopqrstuvwxyz123456''',
]
